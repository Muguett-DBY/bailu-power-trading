name: Sign Windows release tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      SIGNED_ROOT: ${{ github.workspace }}/.release/bailu-signed-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signing configuration
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.BAILU_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.BAILU_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.BAILU_SIGNING_PROFILE }}
        run: |
          if (!$env:SIGNING_ENDPOINT -or !$env:SIGNING_ACCOUNT -or !$env:SIGNING_PROFILE) {
            throw 'Configure the Public Trust account and certificate profile in the windows-signing environment.'
          }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/bailu/go.mod
          cache-dependency-path: tools/bailu/go.sum
      - name: Build Windows x64 and Arm64
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            $binary = Join-Path $env:SIGNED_ROOT "windows/$arch/bailu.exe"
            go -C tools/bailu build -buildvcs=true -trimpath -ldflags='-s -w' -o $binary .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Authenticate to Azure with OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both executables with an RFC 3161 timestamp
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.BAILU_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.BAILU_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.BAILU_SIGNING_PROFILE }}
          files: |
            ${{ env.SIGNED_ROOT }}/windows/amd64/bailu.exe
            ${{ env.SIGNED_ROOT }}/windows/arm64/bailu.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify the signed executables
        shell: pwsh
        run: |
          foreach ($arch in 'amd64', 'arm64') {
            & ./scripts/verify_windows_signature.ps1 (Join-Path $env:SIGNED_ROOT "windows/$arch/bailu.exe")
          }
      - name: Upload the signed release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bailu-signed-windows-${{ github.sha }}
          path: ${{ env.SIGNED_ROOT }}/
          if-no-files-found: error
